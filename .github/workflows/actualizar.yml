name: Publicar en GitHub Pages

# Este observatorio NO se regenera en CI: descargar la BDNS entera son ~2,5 millones de
# concesiones y más de 50.000 convocatorias, varias horas de API. La regeneración se hace en
# local con `scripts/bdns_fetch.py` y `scripts/bdns_build.py`, y se sube el resultado.
# Aquí solo se publica lo que hay en `site/`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
